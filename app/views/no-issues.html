{% extends "layouts/main.html" %}

{% set pageName="No issues found" %}

{% block content %}

<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">

    <h1 class="govuk-heading-l" id="header">No problems found</h1>

    <p class="govuk-body">
      Your content complies with the rules you have selected.
    </p>

    <hr class="govuk-section-break govuk-section-break--m govuk-section-break--visible">

    <div class="govuk-warning-text">
      <span class="govuk-warning-text__icon" aria-hidden="true">!</span>
      <strong class="govuk-warning-text__text">
        <span class="govuk-visually-hidden">Warning</span>
                The checker may miss terms. Always double-check and 2i your content.
      </strong>
    </div>

    <a href="check-text.html#user-text" class="govuk-button">Back to your text</a>
  
  </div>
 
</div>

{% endblock %}
