{% extends "layouts/main.html" %}

{% set pageName="Results" %}

{% block content %}

<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">

    <a href="javascript:window.history.back()" class="govuk-back-link">Back</a>

    <h1 class="govuk-heading-l">There are style problems in your text:</h1>

    <div id="results" class="govuk-body">
      {{ results | safe }}
    </div>

    <div class="govuk-warning-text">
      <span class="govuk-warning-text__icon" aria-hidden="true">!</span>
      <strong class="govuk-warning-text__text">
        <span class="govuk-visually-hidden">Warning</span>
        The checker may miss terms. Always double-check and 2i your content.
      </strong>
    </div>

    <a href="check-text#user-text" class="govuk-button" id="back-to-text">Back to your text </a>
  
  </div>
 
</div>

{% endblock %}
