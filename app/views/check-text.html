{% extends "layouts/main.html" %}

{% set pageName="Check your text" %}

{% block content %}

<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">

    


    
    
    <form action="/check-text-router" method="post" novalidate>

        <fieldset class="govuk-fieldset" role="group" aria-describedby="question-hint">
          <label class="govuk-label govuk-label--xs" for="user-text">
              <h1 class="govuk-!-margin-bottom-1">Check your text</h1>
          </label>
          <p><a class="govuk-body-l" href="/check-controls">Customise which rules to check your text against</a>.</p>
          <textarea class="govuk-textarea" id="user-text" name="user-text" rows="20">{{data['user-text']}}</textarea>
          <button class="govuk-button" type="submit" onclick="checkText()">Check text</button>
        </fieldset>


    </form>

    <button onclick="clearText()" class="govuk-button govuk-button--warning" data-module="govuk-button">
      Delete text
    </button>
  

  <div id="results"></div>

 
</div>

{% endblock %}
